name: 'K8s Deploy Action'
description: 'Custom reusable action to update kubeconfig, configure kustomize image tag, and apply manifests with kubectl'
inputs:
  cluster-name:
    description: 'Name of the EKS cluster'
    required: true
    default: 'cluster'
  aws-region:
    description: 'AWS region'
    required: true
    default: 'us-east-1'
  app-name:
    description: 'Name of the application/image in kustomize (e.g. frontend or backend)'
    required: true
  image-uri:
    description: 'Full image URI with tag to set in kustomization'
    required: true
  k8s-dir:
    description: 'Path to the directory containing k8s manifests'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Kustomize
      uses: imranismail/setup-kustomize@v3

    - name: Update Kubeconfig
      shell: bash
      run: |
        aws eks update-kubeconfig --name ${{ inputs.cluster-name }} --region ${{ inputs.aws-region }}

    - name: Apply Kubernetes Manifests
      shell: bash
      run: |
        cd ${{ inputs.k8s-dir }}
        kustomize edit set image ${{ inputs.app-name }}=${{ inputs.image-uri }}
        kustomize build | kubectl apply -f -
