name: 'PR Status Commenter'
description: 'Posts a comprehensive CI status comment to a Pull Request'
inputs:
  workflow-name:
    description: 'Name of the workflow (e.g. Frontend CI, Backend CI)'
    required: true
  lint-status:
    description: 'Result of the lint job'
    required: true
  test-status:
    description: 'Result of the test job'
    required: true
  build-status:
    description: 'Result of the build job'
    required: true
  github-token:
    description: 'GitHub token for authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Post PR Comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const lintStatus = '${{ inputs.lint-status }}' === 'success' ? '✅ Passed' : '❌ Failed';
          const testStatus = '${{ inputs.test-status }}' === 'success' ? '✅ Passed' : '❌ Failed';
          const buildStatus = '${{ inputs.build-status }}' === 'success' ? '✅ Passed' : '❌ Failed';
          const isSuccess = '${{ inputs.lint-status }}' === 'success' && '${{ inputs.test-status }}' === 'success' && '${{ inputs.build-status }}' === 'success';
          const overall = isSuccess ? '✅ All checks passed' : '❌ Checks failed';

          const body = `### 🚀 ${'${{ inputs.workflow-name }}'} Result: ${overall}

          | Job | Result |
          | :--- | :--- |
          | 🔍 **Lint** | ${lintStatus} |
          | 🧪 **Test** | ${testStatus} |
          | 🐳 **Docker Build** | ${buildStatus} |

          *Automated report generated by GitHub Actions for commit \`${context.sha.substring(0, 7)}\`.*`;

          if (context.issue && context.issue.number) {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }
